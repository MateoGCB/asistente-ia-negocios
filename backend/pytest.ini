[pytest]
testpaths = tests
pythonpath = .
markers =
    slow: concurrency tests with real threads (skip them with: pytest -m "not slow")
# Only these two warnings, matched by their exact message: both come from libraries, not from this project
filterwarnings =
    ignore:_pytest\.python\.CallSpec2 has been renamed to CallSpec\.:pytest.PytestRemovedIn10Warning
    ignore:Using `httpx` with `starlette\.testclient` is deprecated\; install `httpx2` instead\.:starlette.exceptions.StarletteDeprecationWarning
